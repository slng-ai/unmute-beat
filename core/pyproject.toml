[project]
name = "slng-voice-core"
version = "0.1.0"
description = "Unmute Beat: an agentic LLM node for Pipecat and LiveKit Agents, a Pydantic Graph of Pydantic AI agents that owns the conversation while the framework owns the audio."
requires-python = ">=3.14"
dependencies = [
    # Imported directly by core: `interpreters` catches `httpx.HTTPError`.
    "httpx>=0.28.1",
    # `state`, `turn`, `graph` and `interpreters` log through loguru.
    "loguru>=0.7.3",
    # `operations` names its write spans through the OpenTelemetry API; no tracer is configured here.
    "opentelemetry-api>=1.44.0",
    # `values.Phone`: libphonenumber, through pydantic-extra-types' own validator.
    "phonenumbers>=9.0.39",
    "pydantic>=2.13.5",
    # `spec` pulls pydantic-handlebars, which compiles each use case's prompts against its call type.
    # Provider packages (`google`, `openai`) belong to the application that picks the model.
    "pydantic-ai-slim[spec]>=2.46.0",
    "pydantic-extra-types>=2.11.1",
    "pydantic-graph>=2.46.0",
    # Flow files are YAML: `core.flowspec` reads them with safe_load, never load.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only `core.processor` (the frames it reads and writes) and `core.launch` (one call's whole pipeline:
# Silero VAD, smart-turn, SLNG's STT and TTS) import Pipecat.
voice = ["pipecat-ai[silero]>=1.11.0", "pipecat-slng>=0.5.2"]
# Only `core.livekit` imports LiveKit Agents: the second runtime adapter, the same engine behind an AgentSession.
livekit = [
    "livekit-agents[silero,turn-detector]>=1.8.5,<1.9",
    "livekit-plugins-slng>=1.8.5",
]
# Only `core.observability` imports Langfuse, the OpenTelemetry SDK and its OTLP exporter (a local collector).
tracing = ["langfuse>=4.15.4", "opentelemetry-sdk>=1.44.0", "opentelemetry-exporter-otlp-proto-http>=1.44.0"]

[dependency-groups]
dev = ["ruff>=0.14", "ty>=0.0.82"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "core"

[[tool.ty.overrides]]
# Scripted tests pass `None` for a model and a usage they never read.
include = ["tests/**"]

[tool.ty.overrides.rules]
call-non-callable = "ignore"
unresolved-attribute = "ignore"
not-subscriptable = "ignore"
