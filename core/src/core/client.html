<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice call</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --bg: #f5f5f7; --muted: #6e6e73; --accent: #0a66c2; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --bg: #1d1d1f; --muted: #a1a1a6; --accent: #4c9aff; } }
  body { margin: 0; padding: 32px 16px; font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 520px; margin: 0 auto; }
  button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #stop { background: transparent; color: var(--accent); }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Voice call</h1>
  <p>This page plays the agent and tells it how far each reply has played, so the agent knows a read-back was heard before it acts on your yes.</p>
  <button id="start">Start call</button>
  <button id="stop" disabled>Hang up</button>
  <p id="status">Not connected.</p>
  <p id="heard"></p>
  <audio id="bot" autoplay></audio>
</main>
<script>
/*
 * The playback reports core.processor.WebRTCPlayout needs, on a plain RTCPeerConnection with no library.
 *
 * The server sends, for each segment it has finished sending, a mark and a bound: the RTP timestamp the
 * browser must play past on that audio source (SSRC). The browser's own playout position is
 * RTCRtpReceiver.getSynchronizationSources()[i].rtpTimestamp: the RTP timestamp of the media last delivered
 * for playout (W3C webrtc-pc). Once it passes a bound, this page says so, once, and nothing else counts.
 * The comparison is serial (RFC 1982): RTP timestamps wrap at 2^32.
 */
const PLAYOUT = 'rtp-timestamp/1';
const status = document.getElementById('status');
const heard = document.getElementById('heard');
const startButton = document.getElementById('start');
const stopButton = document.getElementById('stop');
let pc = null, channel = null, audio = null, timers = [], pending = new Map(), reported = 0;

function rtvi(type, data) {
  if (channel && channel.readyState === 'open') {
    channel.send(JSON.stringify({label: 'rtvi-ai', type, id: Math.random().toString(36).slice(2, 10), data}));
  }
}

function passed(rtp, bound) {
  return ((rtp - bound) >>> 0) < 2 ** 31;
}

function report() {
  if (!pending.size || !audio) return;
  for (const source of audio.receiver.getSynchronizationSources()) {
    for (const [mark, bound] of pending) {
      if (source.source === bound.source && passed(source.rtpTimestamp, bound.rtp)) {
        rtvi('client-message', {t: 'playout', d: {mark, source: source.source, rtp: source.rtpTimestamp}});
        pending.delete(mark);
        heard.textContent = `Playback reported for ${++reported} replies.`;
      }
    }
  }
}

function received(event) {
  let message;
  try { message = JSON.parse(event.data); } catch { return; }
  if (message.type === 'server-message' && message.data && message.data.t === 'playout-mark') {
    const {mark, source, rtp} = message.data.d || {};
    if (typeof mark === 'string' && Number.isInteger(source) && Number.isInteger(rtp)) pending.set(mark, {source, rtp});
  } else if (message.type === 'bot-started-speaking') {
    status.textContent = 'Agent speaking.';
  } else if (message.type === 'bot-stopped-speaking') {
    status.textContent = 'Listening.';
  }
}

function gathered(connection) {
  return new Promise((resolve) => {
    if (connection.iceGatheringState === 'complete') return resolve();
    const done = () => { if (connection.iceGatheringState === 'complete') resolve(); };
    connection.addEventListener('icegatheringstatechange', done);
    setTimeout(resolve, 2000);
  });
}

async function start() {
  startButton.disabled = true;
  status.textContent = 'Asking for the microphone.';
  try {
    const microphone = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}});
    pc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
    audio = pc.addTransceiver(microphone.getAudioTracks()[0], {direction: 'sendrecv'});
    pc.addTransceiver('video', {direction: 'recvonly'});
    channel = pc.createDataChannel('chat', {ordered: true});
    channel.onmessage = received;
    channel.onopen = () => {
      rtvi('client-ready', {version: '2.1.0', about: {library: 'slng-voice-core', platform_details: {playout: PLAYOUT}}});
      timers.push(setInterval(() => channel.readyState === 'open' && channel.send(`ping: ${Date.now()}`), 1000));
      timers.push(setInterval(report, 20));
      status.textContent = 'Connected.';
      stopButton.disabled = false;
    };
    pc.ontrack = (event) => {
      if (event.track.kind === 'audio') document.getElementById('bot').srcObject = new MediaStream([event.track]);
    };
    pc.onconnectionstatechange = () => {
      if (['failed', 'closed', 'disconnected'].includes(pc.connectionState)) stop();
    };
    status.textContent = 'Connecting.';
    await pc.setLocalDescription(await pc.createOffer());
    await gathered(pc);
    const answer = await fetch('/api/offer', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({sdp: pc.localDescription.sdp, type: pc.localDescription.type}),
    });
    if (!answer.ok) throw new Error(`offer refused: ${answer.status}`);
    await pc.setRemoteDescription(await answer.json());
  } catch (error) {
    status.textContent = `Could not connect: ${error.message}`;
    stop();
  }
}

function stop() {
  timers.forEach(clearInterval);
  timers = [];
  pending.clear();
  if (pc) {
    pc.getSenders().forEach((sender) => sender.track && sender.track.stop());
    pc.close();
  }
  pc = channel = audio = null;
  startButton.disabled = false;
  stopButton.disabled = true;
  if (!status.textContent.startsWith('Could not')) status.textContent = 'Call ended.';
}

startButton.onclick = start;
stopButton.onclick = stop;
</script>
</body>
</html>
