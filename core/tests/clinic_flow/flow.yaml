version: 1
id: clinic-booking
state: clinic.py:ClinicState
identity: patient
greeting: Hello, this is the clinic. How can I help?
steps:
  - id: patient
    kind: collect
    prompt: prompts/patient.md
    question: What is your patient number?
    fields: [patient]
  - id: slot
    kind: collect
    prompt: prompts/slot.md
    question: I have Tuesday at 9 or at 10. Which works for you?
    fields: [slot]
  - id: confirm
    kind: confirm
    code: clinic.py
    then: book
    on_reject: slot
    on_revise: slot
  - id: book
    kind: action
    code: clinic.py
    on_error: failed
  - id: done
    kind: end
    outcome: completed
    say: 'Booked for {slot}, reference {reference}. Goodbye.'
  - id: failed
    kind: end
    outcome: failed
    say: Nothing was booked. Please call again.
