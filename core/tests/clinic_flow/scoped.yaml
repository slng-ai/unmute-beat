# The clinic with a scoped view per step: flow facts and history members each step may replace (`tests.test_context`).
version: 2
id: clinic-scoped
state: consult.py:DeskState
identity: patient
services: clinic.py:Backend
context: {facts: [slot, note], history: {scope: node, turns: 1}}
agents:
  receptionist:
    prompt: prompts/receptionist.md
operations:
  book: scoped.py:RecappedBook
  check_in: consult.py:CheckIn
steps:
  lobby:
    agent: receptionist
    prompt: prompts/lobby.md
    exits: [desk]
    context: {facts: none}
  desk:
    agent: receptionist
    prompt: prompts/desk.md
    requires: [checked_in]
    satisfied_by: front
    fields: [slot, note]
    choices: {slot: clinic.py:free_times}
    operations: [book]
    capabilities: [consult.py:refunds]
    consults:
      - {to: nurse, purpose: 'a medical question about the appointment'}
  front:
    agent: receptionist
    prompt: prompts/front.md
    fields: [patient]
    operations: [check_in]
    capabilities: [scoped.py:notes]
    context: {facts: [patient]}
  nurse:
    agent: receptionist
    prompt: prompts/nurse.md
    context: {facts: none}
