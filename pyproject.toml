# The workspace: `core`, the `studio`, the `runner` and every folder under `use-cases/`, one lock, one `.venv` at the root.
# Each member has its own pyproject; run a use case from its folder with `uv run bot.py`.
[tool.uv.workspace]
members = ["core", "studio", "runner", "use-cases/*"]

[tool.uv]
# livekit-agents 1.8 declares `openai<3` for its own OpenAI-format helpers, while Pydantic AI's OpenAI
# provider needs openai 3. core's LiveKit adapter never calls LiveKit's LLM plugins (the flow owns the
# model), and `core/tests/test_livekit.py` imports every LiveKit module it uses under openai 3.
override-dependencies = ["openai>=3.8"]

[dependency-groups]
# No pytest: every `tests/` folder holds assert scripts run as modules.
dev = [
    "ruff>=0.14",
    "ty>=0.0.82",
]

[tool.ruff]
line-length = 110
target-version = "py314"
# Each use case is its own import root, so isort sees `salon`, `faro` and `evals` as first-party.
src = ["core/src", "studio/src", "runner/src", "use-cases/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "UP", "SIM", "RUF", "D", "PERF", "FURB"]
ignore = [
    "E501",          # the formatter owns wrapping
    "D1",            # a docstring where one earns its place, not on every def
    "D203", "D213",  # conflict with the google convention's D211/D212
    "D417",          # every hit is `ctx`: pydantic-ai plumbing the model never sees
    "D205", "D415",  # tool docstrings are prompt text; their shape is the model's, not pydocstyle's
    "D210",          # a docstring opening on a quoted phrase needs the leading space
]
# `A` (flake8-builtins) is absent on purpose: `exit` is this graph's own vocabulary.

[tool.ruff.lint.per-file-ignores]
# ponytail: `core` passed PERF and FURB first; drop this once each use case has had its own pass.
"use-cases/**" = ["PERF", "FURB"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# `TurnBudget` is a frozen dataclass, so a call in a default argument is safe.
extend-immutable-calls = ["core.policies.TurnBudget"]

[tool.ruff.format]
quote-style = "single"
