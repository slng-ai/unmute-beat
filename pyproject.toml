[project]
name = "slng-voice-harness"
version = "0.1.0"
description = "A Pydantic AI agency standing where Pipecat's LLM service would: the agents own the conversation, Pipecat owns the audio."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langfuse>=4.15.4",
    # `spec` pulls pydantic-handlebars, which compiles salon/prompts/*.md and the examples' prompts against their call types.
    "pydantic-ai-slim[google,openai,spec]>=2.46.0",
    # Google's libphonenumber: a regex cannot know a Spanish number has nine national digits.
    "pydantic-extra-types[phonenumbers]>=2.11.1",
    "pipecat-ai[google,runner,silero,webrtc]>=1.11.0",
    "pipecat-slng>=0.5.2",
    "python-dotenv>=1.2.3",
    "websockets>=16.1.1",
    # Flow files are YAML: core/flowspec.py reads them with safe_load, never load.
    "pyyaml>=6.0",
]

[dependency-groups]
# No pytest: tests/ are assert scripts run as modules.
dev = [
    "ruff>=0.14",
    "ty>=0.0.82",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "UP", "SIM", "RUF", "D"]
ignore = [
    "E501",          # the formatter owns wrapping
    "D1",            # a docstring where one earns its place, not on every def
    "D203", "D213",  # conflict with the google convention's D211/D212
    "D417",          # every hit is `ctx`: pydantic-ai plumbing the model never sees
    "D205", "D415",  # tool docstrings are prompt text; their shape is the model's, not pydocstyle's
    "D210",          # a docstring opening on a quoted phrase needs the leading space
]
# `A` (flake8-builtins) is absent on purpose: `exit` is this graph's own vocabulary.

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# `TurnBudget` is a frozen dataclass, so a call in a default argument is safe.
extend-immutable-calls = ["core.policies.TurnBudget"]

[tool.ruff.format]
quote-style = "single"

[[tool.ty.overrides]]
# Scripted tests pass `None` for a model and a usage they never read.
include = ["tests/**"]

[tool.ty.overrides.rules]
call-non-callable = "ignore"
unresolved-attribute = "ignore"
not-subscriptable = "ignore"
