[project]
name = "slng-voice-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langfuse>=4.15.4",
    # `spec` pulls pydantic-handlebars: it is what compiles prompts/*.md into
    # TemplateStr instructions that render against CallState.
    "pydantic-ai-slim[google,openai,spec]>=2.46.0",
    # `phonenumbers` is Google's libphonenumber. A regex cannot know that
    # +348340464 is eight national digits short of a real Spanish number.
    "pydantic-extra-types[phonenumbers]>=2.11.1",
    "pipecat-ai[runner,silero,webrtc]>=1.11.0",
    "pipecat-slng>=0.5.2",
    "python-dotenv>=1.2.3",
    "websockets>=16.1.1",
]
