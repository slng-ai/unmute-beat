[project]
name = "slng-voice-runner"
version = "0.1.0"
description = "The runner service: a FastAPI app that loads every agent once and carries their calls, over WebRTC or text."
requires-python = ">=3.14"
dependencies = [
    "slng-voice-core[voice,tracing]",
    # Every core use case's model is Gemini on Vertex or OpenAI-compatible: the runner carries them all.
    "pydantic-ai-slim[google,openai]>=2.46.0",
    # SmallWebRTC (the browser's calls) and the runner's request types.
    "pipecat-ai[runner,silero,webrtc]>=1.11.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # The link to the studio: one websocket per runner, the events going out.
    "websockets>=16.1.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
slng-runner = "voice_runner.__main__:main"

[dependency-groups]
dev = ["ruff>=0.14", "ty>=0.0.82"]

[tool.uv.sources]
slng-voice-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "voice_runner"

[tool.ty.src]
include = ["src", "tests"]

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
call-non-callable = "ignore"
unresolved-attribute = "ignore"
not-subscriptable = "ignore"
