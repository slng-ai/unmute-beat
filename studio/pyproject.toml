[project]
name = "slng-voice-studio"
version = "0.1.0"
description = "A local studio for slng-voice-core: follow a call through its step graph, read every run, change the config."
requires-python = ">=3.14"
dependencies = [
    "slng-voice-core",
    # The engine's HTTP API and the built web app. Both already in the lock through Pipecat's runner.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    # `studio.check` compiles each flow on `TestModel`, so its moves are the engine's; no provider is called.
    "pydantic-ai-slim>=2.46.0",
    # The store (decision 4 of docs/studio/plan.md): every event and snapshot in Redis for a week,
    # copied to Postgres behind it. Only the studio writes either.
    "redis>=5.2",
    "asyncpg>=0.30",
    # Calls are placed on runners and their offers and turns passed on, over HTTP.
    "httpx>=0.28.1",
]

[project.scripts]
# `uv run slng studio up`: the containers, the engine and the web app, in that order.
slng = "studio.cli:main"

[dependency-groups]
dev = ["ruff>=0.14", "ty>=0.0.82"]

[tool.uv.sources]
slng-voice-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "studio"

[tool.ty.src]
include = ["src", "tests"]
