# Faro, a bilingual language-learning companion, on core's public contract in manifest version 2: one agent
# per step, keyed by id, sharing one call's state, each with its own prompt, fields and operations.
#
# The steps are the learner's journey: identify, sign up, onboard, place, agree a plan, then lessons from the
# menu. Where a learner goes next after a save is the store's answer, in the receipt (`route: next`), never a
# model's. Every conversation step is `speech: structured`: its agent answers with one typed output, and
# code says every receipt. Grading is the step's agent's: it records the attempt and its grade, and code carries out `record_attempt` at once
# (`carries_out`). Only the coach may explain or hint, and reaching it goes through `help`, which marks the
# exercise helped in the store first: an answer after help is never independent. Each step sees only the
# facts it lists, and by default its own turns. Everything is checked when Faro starts, never mid-call.

version: 2
id: faro
app_version: '2026.09.30-v2'
state: state.py:FaroState
identity: phone
entry: identify
language: explanation
locales:
  EN:
    base: english
    goodbye: Goodbye, and see you next time!
    refusals:
      greater_than_equal: A session is between five and sixty minutes. How long would you like?
      less_than_equal: A session is between five and sixty minutes. How long would you like?
  ES:
    base: spanish
    goodbye: ¡Hasta la próxima!
    refusals:
      greater_than_equal: Una sesión dura entre cinco y sesenta minutos. ¿Cuánto quieres?
      less_than_equal: Una sesión dura entre cinco y sesenta minutos. ¿Cuánto quieres?
model: google-cloud:gemini-3.5-flash-lite

agents:
  faro:
    prompt: prompts/_voice.md
    spec:
      model_settings:
        service_tier: priority
        google_thinking_config: {thinking_level: MINIMAL}

operations:
  confirm_phone:
    function: functions.py:confirm_phone
    args: {phone: phone}
    readback: functions.py:phone_words
    matches: {phone: phone}
    assign:
      confirmed: phone
      learner_id: learner_id
      learner_name: learner_name
      profile_language: profile_language
      session_id: session_id
      notes: notes
      waiting: waiting
      draft_id: draft_id
      draft_revision: draft_revision
      draft_target: draft_target
      draft_goal: draft_goal
      draft_level: draft_level
      draft_minutes: draft_minutes
    route: next
    say: '{said}'
  agree_signup:
    function: functions.py:agree_signup
    args: {phone: confirmed}
    readback: functions.py:signup_words
    changes: false
    matches: {phone: phone}
    succeeds: {agreed: true}
    assign: {signup_agreed: agreed}
    say: '{said}'
  create_learner:
    function: functions.py:create_learner
    args: {phone: confirmed, name: name, agreed: signup_agreed}
    approval: none
    matches: {phone: phone}
    assign:
      learner_id: learner_id
      learner_name: learner_name
      profile_language: profile_language
      session_id: session_id
      notes: notes
    route: next
    say: '{said}'
  save_onboarding:
    function: functions.py:save_onboarding
    args: {learner_id: learner_id, session_id: session_id, learn: learn, purpose: purpose, length: length}
    approval: none
    matches: {learner_id: learner_id}
    assign: {waiting: waiting}
    route: next
    say: '{said}'
  repeat_waiting:
    function: functions.py:repeat_waiting
    args: {learner_id: learner_id, session_id: session_id}
    approval: none
    changes: false
    matches: {learner_id: learner_id}
    say: '{said}'
  note_help:
    function: functions.py:note_help
    args: {learner_id: learner_id, session_id: session_id, waiting: waiting}
    approval: none
    matches: {learner_id: learner_id}
    say: '{said}'
  record_attempt:
    function: functions.py:record_attempt
    args:
      learner_id: learner_id
      session_id: session_id
      answer: answer
      grade: grade
      feedback: feedback
      evidence: evidence
    approval: none
    idempotent: true
    reconcile: functions.py:find_attempt
    matches: {learner_id: learner_id}
    assign:
      waiting: waiting
      draft_id: draft_id
      draft_revision: draft_revision
      draft_target: draft_target
      draft_goal: draft_goal
      draft_level: draft_level
      draft_minutes: draft_minutes
    route: next
    say: '{said}'
  activate_plan:
    function: functions.py:activate_plan
    args:
      learner_id: learner_id
      session_id: session_id
      plan_id: draft_id
      revision: draft_revision
      target: draft_target
      level: draft_level
      goal: draft_goal
      minutes: draft_minutes
      new_goal: plan_goal
      new_minutes: plan_minutes
    readback: functions.py:proposal_words
    matches: {learner_id: learner_id}
    route: next
    say: '{said}'
  decline_plan:
    function: functions.py:decline_plan
    args: {learner_id: learner_id, session_id: session_id, plan_id: draft_id, keep: keep_plan}
    approval: none
    matches: {learner_id: learner_id}
    route: next
    say: '{said}'
  continue_lesson:
    function: functions.py:continue_lesson
    args: {learner_id: learner_id, session_id: session_id}
    approval: none
    matches: {learner_id: learner_id}
    assign: {waiting: waiting}
    route: next
    say: '{said}'
  start_reassessment:
    function: functions.py:start_reassessment
    args: {learner_id: learner_id, session_id: session_id}
    approval: none
    matches: {learner_id: learner_id}
    assign: {waiting: waiting}
    route: next
    say: '{said}'
  read_progress:
    function: functions.py:read_progress
    args: {learner_id: learner_id, session_id: session_id}
    approval: none
    changes: false
    matches: {learner_id: learner_id}
    say: '{said}'
  remember:
    function: functions.py:remember
    args: {learner_id: learner_id, session_id: session_id, key: fact_key, text: fact_text}
    approval: none
    matches: {learner_id: learner_id}
    say: '{said}'

steps:
  identify:
    agent: faro
    prompt: prompts/identify.md
    fields: [phone, asked_language]
    context: {facts: [phone, asked_language, explanation]}
    operations: [confirm_phone]
    opens_with: confirm_phone
    asks: {phone: 'What is your full phone number, starting with plus thirty-four?'}
    reads_back: {confirm_phone: [phone, asked_language]}

  signup:
    agent: faro
    prompt: prompts/signup.md
    fields: [name, asked_language]
    context: {facts: [name, asked_language, explanation]}
    operations: [agree_signup]
    opens_with: agree_signup
    reads_back: {agree_signup: [asked_language]}
    carries_out: {create_learner: [name]}

  onboarding:
    agent: faro
    prompt: prompts/onboarding.md
    fields: [learn, purpose, length, asked_language]
    context: {facts: [learn, purpose, length, asked_language, explanation, learner_name]}
    carries_out: {save_onboarding: [learn, purpose, length]}

  assessment:
    agent: faro
    prompt: prompts/assessment.md
    fields: [answer, grade, feedback, evidence, asked_language]
    quoted: [answer]
    context: {facts: [answer, grade, feedback, evidence, asked_language, explanation, waiting, learner_name, notes]}
    carries_out: {record_attempt: [grade], repeat_waiting: [asked_language]}
    exits:
      - {to: help, purpose: 'a question, a request to explain, repeat or slow down, or hesitation: anything but an attempt'}

  plan:
    agent: faro
    prompt: prompts/plan.md
    fields: [plan_minutes, plan_goal, keep_plan, asked_language]
    context:
      facts: [plan_minutes, plan_goal, keep_plan, asked_language, explanation, learner_name, notes,
              draft_target, draft_goal, draft_level, draft_minutes]
    operations: [activate_plan]
    opens_with: activate_plan
    reads_back: {activate_plan: [plan_minutes, plan_goal, asked_language]}
    carries_out: {decline_plan: [keep_plan]}

  menu:
    agent: faro
    prompt: prompts/menu.md
    fields: [fact_key, fact_text, asked_language]
    context: {facts: [fact_key, fact_text, asked_language, explanation, learner_name, notes]}
    operations: [continue_lesson, start_reassessment, read_progress]
    carries_out: {remember: [fact_text]}

  lesson:
    agent: faro
    prompt: prompts/lesson.md
    fields: [answer, grade, feedback, asked_language]
    quoted: [answer]
    context: {facts: [answer, grade, feedback, asked_language, explanation, waiting, learner_name, notes]}
    carries_out: {record_attempt: [grade], repeat_waiting: [asked_language]}
    exits:
      - {to: help, purpose: 'a question, a request to explain, repeat or slow down, a hint, or hesitation: anything but an attempt'}
      - {to: menu, purpose: 'they want a recap, to check their level, or to stop the lesson'}

  help: {kind: action, operation: note_help, then: coach, on_error: coach, on_unknown: coach}

  coach:
    agent: faro
    prompt: prompts/coach.md
    fields: [answer, grade, feedback, evidence, fact_key, fact_text, asked_language]
    quoted: [answer]
    # The exercise the coach helps with was said on the lesson's turns, not the coach's: it sees the whole
    # conversation, as in `agent.yaml`. State has no field holding the exercise's words to show it instead.
    context:
      facts: [answer, grade, feedback, evidence, fact_key, fact_text, asked_language, explanation, waiting,
              learner_name, notes]
      history: {scope: conversation}
    carries_out: {record_attempt: [grade], remember: [fact_text]}
    exits:
      - {to: menu, purpose: 'they want a recap, to check their level, or to stop practising this'}
