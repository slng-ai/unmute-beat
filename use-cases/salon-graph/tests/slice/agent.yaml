# The salon's identity -> read-back -> lookup path, on core's public manifest and the salon's real types.
version: 1
id: salon-identity-slice
state: slice.py:Caller
identity: phone
services: slice.py:Diary
operations:
  look_up:
    function: slice.py:look_up
    args: {phone: phone}
    readback: slice.py:read_back
    matches: {customer_phone: phone}
    assign: {verified: customer_status}
    say: Thanks, I have you.
steps:
  - id: phone
    kind: collect
    prompt: prompts/phone.md
    question: Which phone number should I use? Please say it with the country code.
    fields: [phone]
  - {id: confirm, kind: confirm, operation: look_up, then: look_up, on_reject: phone, on_revise: phone}
  - {id: look_up, kind: action, operation: look_up, then: done, on_error: failed}
  - {id: done, kind: end, outcome: completed, say: 'How can I help you today?'}
  - {id: failed, kind: end, outcome: failed, say: I cannot check who you are just now.}
