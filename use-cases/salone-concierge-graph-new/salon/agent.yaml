# Sage and Stone on core's simpler contract, in manifest version 2: steps keyed by id.
#
# Each step is one agent. Its words and the caller's update travel in one typed decision
# (`speech: structured`, the version 2 default), so a step records what the caller said with the answer
# it gives. It answers through what is declared here: fields it may record, choices it may offer,
# operations it may carry out (each read back first, and done only on the caller's yes to that
# read-back), steps it may hand the caller to, and a stylist it may consult and get the caller back from.
# Each step sees only the facts it lists, and its own last eight turns (`context`). Everything is checked
# when the salon starts, never mid-call.

version: 2
id: sage-and-stone
app_version: '2026.09.30-v2'
greeting: "Hi, you've reached Sage and Stone. Robin speaking, what can I do for you?"
state: state.py:SalonState
identity: customer_phone
entry: concierge
current_datetime: {timezone: Europe/Madrid, calendar_days: 14}
context: {facts: none, history: {scope: node, turns: 8}}
locale:
  base: english
  goodbye: Thanks for calling Sage and Stone. Have a lovely day!
model: google-cloud:gemini-3.5-flash-lite
quote_caller: true
includes:
  diary: prompts/_diary.md
  services: prompts/knowledge/services.md
  complaint_guidance: prompts/knowledge/complaint-guidance.md
  stylist: prompts/knowledge/stylist.md

agents:
  robin:
    prompt: prompts/_voice.md
    spec:
      model_settings:
        service_tier: priority
        google_thinking_config: {thinking_level: MINIMAL}

operations:
  lookup_customer: operations.py:LookupCustomer
  book_appointment: operations.py:BookAppointment
  move_appointment: operations.py:MoveAppointment
  cancel_appointment: operations.py:CancelAppointment
  record_complaint: operations.py:RecordComplaint

steps:
  concierge:
    agent: robin
    prompt: prompts/concierge.md
    fields: [service, booking_day, booking_time]
    context: {facts: [service, booking_day, booking_time]}
    capabilities: [capabilities.py:refunds]
    exits:
      - {to: booking, purpose: 'a new booking'}
      - {to: moving, purpose: 'moving a booking they hold to another day or time'}
      - {to: cancelling, purpose: 'cancelling a booking they hold'}
      - {to: complaints, purpose: 'a complaint, a refund, a manager, or a free visit because of a past service'}
      - {to: verify, purpose: 'a correction to a phone number already confirmed'}
    consults:
      - {to: stylist, purpose: 'a question about hair: which service suits them, colour, aftercare, how long a service takes'}

  verify:
    agent: robin
    prompt: prompts/verify.md
    fields: [customer_phone, service, booking_day, booking_time]
    context: {facts: [customer_phone, service, booking_day, booking_time, customer]}
    operations: [lookup_customer]
    opens_with: lookup_customer
    reads_back: {lookup_customer: [customer_phone]}
    asks: {customer_phone: "Which phone number should I use? Please say it with the country code."}
    exits:
      - {to: concierge, purpose: 'the caller will not confirm a number, or asks about something else entirely'}

  # Each of the next three does one thing, so its first line on arrival is code's (`offers:`): find_times
  # offers the times or asks for the service or day it still needs; the others name the bookings held.
  booking:
    agent: robin
    prompt: prompts/booking.md
    requires: [customer]
    satisfied_by: verify
    fields: [service, booking_day, booking_time, slot]
    context: {facts: [service, booking_day, booking_time, slot]}
    choices:
      slot: {function: offers.py:find_times, after: [booking_id, service, booking_day, booking_time]}
    offers: [slot]
    operations: [book_appointment]
    reads_back: {book_appointment: [slot]}
    capabilities: [capabilities.py:refunds]
    exits:
      - {to: moving, purpose: 'moving a booking they hold, the one just made included'}
      - {to: cancelling, purpose: 'cancelling a booking they hold, the one just made included'}
      - {to: complaints, purpose: 'a complaint about a past service'}
      - {to: concierge, purpose: 'they give up booking, or ask about something unrelated to booking'}
    consults:
      - {to: stylist, purpose: 'a question about hair: which service suits them, colour, aftercare, how long a service takes'}

  moving:
    agent: robin
    prompt: prompts/moving.md
    requires: [customer]
    satisfied_by: verify
    fields: [booking_id, service, booking_day, booking_time, slot]
    context: {facts: [booking_id, service, booking_day, booking_time, slot]}
    choices:
      # The booking being moved rests on no field; a time on offer rests on what was asked for, as in booking.
      booking_id: {function: offers.py:bookings_to_move, after: []}
      slot: {function: offers.py:find_times, after: [booking_id, service, booking_day, booking_time]}
    offers: [booking_id]
    operations: [move_appointment]
    reads_back: {move_appointment: [slot]}
    capabilities: [capabilities.py:refunds]
    exits:
      - {to: booking, purpose: 'a new booking instead of a move'}
      - {to: cancelling, purpose: 'cancelling instead of moving'}
      - {to: complaints, purpose: 'a complaint about a past service'}
      - {to: concierge, purpose: 'they give up, or ask about something unrelated'}

  cancelling:
    agent: robin
    prompt: prompts/cancelling.md
    requires: [customer]
    satisfied_by: verify
    fields: [booking_id]
    context: {facts: [booking_id]}
    choices:
      booking_id: {function: offers.py:bookings_to_cancel, after: []}
    offers: [booking_id]
    operations: [cancel_appointment]
    capabilities: [capabilities.py:refunds]
    exits:
      - {to: booking, purpose: 'a new booking instead'}
      - {to: moving, purpose: 'moving instead of cancelling'}
      - {to: complaints, purpose: 'a complaint about a past service'}
      - {to: concierge, purpose: 'they give up, or ask about something unrelated'}

  complaints:
    agent: robin
    prompt: prompts/complaints.md
    requires: [customer]
    satisfied_by: verify
    fields: [complaint, wanted_outcome, wants_refund]
    context: {facts: [complaint, wanted_outcome, wants_refund]}
    operations: [record_complaint]
    capabilities: [capabilities.py:refunds]
    exits:
      - {to: booking, purpose: 'they want a new booking'}
      - {to: moving, purpose: 'they want to move a booking they hold'}
      - {to: cancelling, purpose: 'they want to cancel a booking they hold'}
      - {to: concierge, purpose: 'a separate salon question, or they abandon the complaint'}

  stylist:
    agent: robin
    prompt: prompts/stylist.md
    context: {facts: [service, booking_day, booking_time]}
